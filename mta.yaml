_schema-version: "3.1"
ID: store
description: A simple CAP project.
version: 1.0.0-SNAPSHOT
modules:
  - name: store-srv
    type: java
    path: srv
    properties:
      JBP_CONFIG_COMPONENTS: 'jres: [''com.sap.xs.java.buildpack.jre.SAPMachineJRE'']'
      JBP_CONFIG_SAP_MACHINE_JRE: '{ version: 21.+ }'
      SPRING_PROFILES_ACTIVE: hybrid,default
    requires:
      - name: store-destination
      - name: store-connectivity
      - name: demoappjava-public-uaa
      - name: catalog-api
        properties:
          Catalog: https://sdmgoogleworkspacedev-i528798-demoappjava-srv.cfapps.eu12.hana.ondemand.com
      - name: app-api
        properties:
          CDS_MULTITENANCY_APPUI_URL: ~{url}
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: sap_java_buildpack_jakarta
      readiness-health-check-http-endpoint: /
      readiness-health-check-type: http
    build-parameters:
      build-result: target/*-exec.jar
      builder: custom
      commands:
        - mvn clean package -DskipTests=true
  - name: store-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: store-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - notebookwriter.zip
          name: notebookwriter
          target-path: resources/
        - artifacts:
            - localbookattach.zip
          name: localbookattach
          target-path: resources/
  - name: notebookwriter
    type: html5
    path: app/notebook_writer
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
  - name: localbookattach
    type: html5
    path: app/localbook_attach
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []

  - name: store
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: demoappjava-public-uaa
    provides:
      - name: app-api
        properties:
          url: ${default-url}
resources:
  - name: store-destination
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: false
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
      service: destination
      service-plan: lite
  - name: store-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: store-html5-service
      service-plan: app-host
  - name: store-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
  - name: demoappjava-public-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: dedicated
        xsappname: demoappjava-sdmgoogleworkspacedev-i528798-2
      path: ./xs-security.json
      service: xsuaa
      service-plan: application
  - name: catalog-api
    type: configuration
    parameters:
      provider-id: demoappjava:catalog-api
      provider-nid: mta
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
